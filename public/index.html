<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat Expenses</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F2F5F7; --card:#fff; --ink:#18222E; --muted:#6B7785; --line:#DDE3E9; --a:#0F766E; --b:#C2410C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Manrope, system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1,h2,.big { font-family:'Bricolage Grotesque', Manrope, sans-serif; margin:0; }
  h2 { font-size:18px; margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .big { font-size:clamp(26px,6vw,38px); font-weight:800; line-height:1.15; }
  .muted { color:var(--muted); }
  .bar { display:flex; height:14px; border-radius:7px; overflow:hidden; margin:16px 0 8px; background:var(--line); }
  .legend { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  form .full { grid-column:1 / -1; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:3px; }
  input, select, button { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { background:var(--ink); color:#fff; border:0; font-weight:700; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--a); outline-offset:1px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row small { color:var(--muted); }
  .amt { font-weight:700; white-space:nowrap; }
  .del { width:auto; background:none; color:var(--muted); padding:4px 8px; font-weight:500; }
  .filters { display:flex; gap:10px; }
  .err { color:#B91C1C; min-height:20px; font-size:14px; }
  #login { max-width:320px; margin:20vh auto; }
  @media (max-width:520px) { form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <div id="login" class="card" hidden>
    <h1 style="font-size:22px;margin-bottom:10px">Flat Expenses</h1>
    <label for="pin">Enter the shared PIN</label>
    <input id="pin" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">Open</button>
  </div>

  <div id="app" hidden>
    <h1 style="font-size:20px;margin-bottom:14px">Flat Expenses</h1>

    <section class="card" aria-live="polite">
      <div class="big" id="settle"></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </section>

    <h2>Add an expense</h2>
    <section class="card">
      <form id="form">
        <div><label for="paid_by">Who paid</label><select id="paid_by" required></select></div>
        <div><label for="amount">Amount (₹)</label><input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required></div>
        <div class="full"><label for="description">What was it for</label><input id="description" maxlength="200" placeholder="e.g. Electricity bill, groceries, Wi-Fi" required></div>
        <div><label for="category">Category</label>
          <select id="category"><option>Rent</option><option>Electricity</option><option>Wi-Fi</option><option>Groceries</option><option>Household</option><option>Food</option><option>Other</option></select></div>
        <div><label for="spent_on">Date</label><input id="spent_on" type="date" required></div>
        <div class="err full" id="formErr"></div>
        <button class="full" type="submit">Add expense</button>
      </form>
    </section>

    <h2>All expenses</h2>
    <div class="filters" style="margin-bottom:10px">
      <select id="month" aria-label="Filter by month"></select>
    </div>
    <section class="card" id="list"></section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['var(--a)', 'var(--b)', '#475569', '#7C3AED'];
const money = n => '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
let people = [], expenses = [], pin = localStorage.getItem('pin') || '';

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-pin': pin } });
  if (res.status === 401) { localStorage.removeItem('pin'); showLogin('Wrong PIN, try again.'); throw new Error('auth'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function showLogin(msg = '') { $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg; }

async function start() {
  const cfg = await (await fetch('/api/config')).json();
  people = cfg.people;
  if (cfg.pinRequired && !pin) return showLogin();
  $('login').hidden = true; $('app').hidden = false;
  $('paid_by').innerHTML = people.map(p => `<option>${p}</option>`).join('');
  $('spent_on').value = new Date().toISOString().slice(0, 10);
  await load();
}

async function load() { expenses = await api('/expenses'); renderMonths(); render(); }

function renderMonths() {
  const current = $('month').value || 'all';
  const months = [...new Set(expenses.map(e => e.spent_on.slice(0, 7)))];
  $('month').innerHTML = '<option value="all">All time</option>' +
    months.map(m => `<option value="${m}">${new Date(m + '-01').toLocaleString('en-IN', { month: 'long', year: 'numeric' })}</option>`).join('');
  $('month').value = months.includes(current) || current === 'all' ? current : 'all';
}

function render() {
  const m = $('month').value;
  const items = m === 'all' ? expenses : expenses.filter(e => e.spent_on.startsWith(m));
  const paid = Object.fromEntries(people.map(p => [p, 0]));
  items.forEach(e => paid[e.paid_by] += e.amount);
  const total = Object.values(paid).reduce((a, b) => a + b, 0);
  const share = total / people.length;

  // Who owes whom: people who paid less than their share pay those who paid more.
  const owe = people.map(p => ({ p, net: paid[p] - share }));
  const debtors = owe.filter(o => o.net < -0.005).sort((a, b) => a.net - b.net);
  const creditors = owe.filter(o => o.net > 0.005).sort((a, b) => b.net - a.net);
  const lines = [];
  for (const d of debtors) for (const c of creditors) {
    const pay = Math.min(-d.net, c.net); if (pay < 0.005) continue;
    lines.push(`${d.p} owes ${c.p} ${money(Math.round(pay * 100) / 100)}`); d.net += pay; c.net -= pay;
  }
  $('settle').textContent = items.length ? (lines.join('. ') || 'All settled up') : 'No expenses yet';
  $('bar').innerHTML = total ? people.map((p, i) => `<div style="width:${paid[p] / total * 100}%;background:${COLORS[i % 4]}"></div>`).join('') : '';
  $('legend').innerHTML = people.map((p, i) => `<span><span class="dot" style="background:${COLORS[i % 4]}"></span>${p} paid ${money(paid[p])}</span>`).join('') +
    `<span class="muted">Total ${money(total)}, each share ${money(share)}</span>`;

  $('list').innerHTML = items.length ? items.map(e => `
    <div class="row"><div><strong>${esc(e.description)}</strong><br><small>${e.paid_by} paid · ${e.category} · ${new Date(e.spent_on).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</small></div>
    <div style="display:flex;align-items:center;gap:6px"><span class="amt">${money(e.amount)}</span><button class="del" data-id="${e.id}" aria-label="Delete ${esc(e.description)}">Delete</button></div></div>`).join('')
    : '<span class="muted">Add your first expense above.</span>';
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

$('form').addEventListener('submit', async ev => {
  ev.preventDefault(); $('formErr').textContent = '';
  try {
    await api('/expenses', { method: 'POST', body: JSON.stringify({ spent_on: $('spent_on').value, paid_by: $('paid_by').value, amount: $('amount').value, description: $('description').value, category: $('category').value }) });
    $('amount').value = ''; $('description').value = ''; await load();
  } catch (e) { $('formErr').textContent = e.message; }
});
$('list').addEventListener('click', async ev => {
  const id = ev.target.dataset.id;
  if (id && confirm('Delete this expense?')) { await api('/expenses/' + id, { method: 'DELETE' }); await load(); }
});
$('month').addEventListener('change', render);
$('loginBtn').addEventListener('click', () => { pin = $('pin').value; localStorage.setItem('pin', pin); start().catch(() => {}); });
start();
</script>
</body>
</html>
